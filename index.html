<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightlife Scanner — UK House, Disco & Underground Events</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #12121f;
      color: #ffffff;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #2a1b47 0%, #1a1a2e 100%);
      padding: 3rem 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }

    header p {
      color: #b8b8d4;
      font-size: 1.1rem;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .search-section {
      margin-bottom: 2.5rem;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #e0e0ff;
    }

    .search-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    input, select {
      padding: 0.85rem 1rem;
      border: 1px solid #3a3a5c;
      border-radius: 6px;
      background: #1e1e30;
      color: #fff;
      font-size: 0.95rem;
    }

    input::placeholder {
      color: #8888a8;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #6c5ce7;
    }

    .results-info {
      color: #a0a0c0;
      margin-bottom: 1.2rem;
      font-size: 0.95rem;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.2rem;
    }

    .event {
      background: #1c1c30;
      border-radius: 10px;
      padding: 1.3rem;
      border: 1px solid #2e2e4a;
      transition: transform 0.2s, border-color 0.2s;
    }

    .event:hover {
      transform: translateY(-3px);
      border-color: #6c5ce7;
    }

    .tag {
      display: inline-block;
      background: #6c5ce7;
      color: #fff;
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      margin-bottom: 0.8rem;
    }

    .event h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .event p {
      font-size: 0.85rem;
      color: #a8a8c8;
      margin-bottom: 0.8rem;
    }

    .event a {
      color: #a29bfe;
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 500;
    }

    .event a:hover {
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #707090;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #606080;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .search-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>NIGHTLIFE SCANNER</h1>
    <p>Discover club nights, DJs and dance music across the UK.</p>
  </header>

  <main>
    <section class="search-section">
      <h2>Find your next night out</h2>
      <div class="search-grid">
        <input type="text" id="search" placeholder="Search house, DJs, clubs...">
        <select id="city">
          <option value="">All UK locations</option>
          <option value="Edinburgh">Edinburgh</option>
          <option value="Glasgow">Glasgow</option>
          <option value="Fife">Fife</option>
        </select>
        <select id="genre">
          <option value="">All genres</option>
          <option value="House">House</option>
          <option value="Disco House">Disco House</option>
          <option value="Underground">Underground</option>
        </select>
      </div>
      <div class="results-info" id="count">0 verified event(s) listed</div>
    </section>

    <div id="events" class="events-grid">
      <div class="empty-state">Loading events...</div>
    </div>
  </main>

  <footer>
    Nightlife Scanner · UK club and DJ directory
  </footer>

<script>
const API_URL = "https://fnightlife-scanner-api.nnr2f4m2jh.workers.dev/api/events";
let allEvents = [];

const search = document.getElementById("search");
const city = document.getElementById("city");
const genre = document.getElementById("genre");
const output = document.getElementById("events");

async function loadEvents() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    allEvents = data.events || [];
  } catch (err) {
    console.log("API loading error:", err);
    allEvents = [];
  }
  render();
}

function render() {
  const q = search.value.toLowerCase();
  const results = allEvents.filter(e => {
    const text = [e.title, e.city, e.venue, e.genre].join(" ").toLowerCase();
    return text.includes(q) &&
      (!city.value || e.city === city.value) &&
      (!genre.value || e.genre === genre.value);
  });

  document.getElementById("count").textContent =
    results.length + " verified event(s) listed";

  output.replaceChildren();

  if (results.length === 0) {
    output.innerHTML = `<div class="empty-state">No events found. Check back for new listings.</div>`;
    return;
  }

  results.forEach(e => {
    const card = document.createElement("article");
    card.className = "event";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = e.genre;

    const title = document.createElement("h3");
    title.textContent = e.title;

    const details = document.createElement("p");
    details.textContent = e.city + " · " + e.venue + " · " + e.date;

    const link = document.createElement("a");
    link.href = e.url || "#";
    link.target = "_blank";
    link.textContent = "Tickets & details →";

    card.append(tag, title, details, link);
    output.appendChild(card);
  });
}

[search, city, genre].forEach(el =>
  el.addEventListener("input", render)
);

// Load on startup
loadEvents();
</script>

</body>
</html>
